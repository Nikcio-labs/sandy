<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sandy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // The preview harness (browser + mocked IPC) is opt-in per URL; the
      // Tauri build never loads it.
      if (new URLSearchParams(location.search).has("preview")) {
        import("/src/preview.tsx");
      } else {
        import("/src/main.tsx");
      }
    </script>
  </body>
</html>
