name: Release build

# Build the Tauri app at the released commit, attach installers to the
# release, and publish it. Invoked by release.yml after release-please
# opens a release.
#
# Inputs:
# - tag: the release tag to build at and upload artifacts to
# - sha: the commit to build

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  sandy:
    name: Build Sandy — ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macOS (Apple silicon)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev file

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Rust cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-${{ matrix.os }}-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            rust-${{ matrix.os }}-${{ matrix.target }}-

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The updater refuses unsigned bundles, so every release build must run
      # with the signing key; the key has no password.
      - name: Build Tauri app
        run: pnpm tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATER_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATER_SIGNING_KEY_PASSWORD }}

      - name: Prepare artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts
          find src-tauri/target -path '*release/bundle*' -name '*.AppImage' -exec cp {} artifacts/ \;
          find src-tauri/target -path '*release/bundle*' -name '*.AppImage.sig' -exec cp {} artifacts/ \;
          find src-tauri/target -path '*release/bundle*' -name '*.deb' -exec cp {} artifacts/ \;

      - name: Prepare artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          find src-tauri/target -path '*release/bundle*' -name '*.dmg' -exec cp {} artifacts/ \;
          # The updater installs the .app.tar.gz, not the .dmg.
          find src-tauri/target -path '*release/bundle*' -name '*.app.tar.gz' -exec cp {} artifacts/ \;
          find src-tauri/target -path '*release/bundle*' -name '*.app.tar.gz.sig' -exec cp {} artifacts/ \;
          # The bare .app directory stays out on purpose: gh release upload
          # cannot upload directories, and users install from the .dmg.

      - name: Prepare artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $bundle = "src-tauri/target/${{ matrix.target }}/release/bundle"
          Copy-Item "$bundle/msi/*.msi" artifacts
          Copy-Item "$bundle/msi/*.msi.sig" artifacts
          Copy-Item "$bundle/nsis/*-setup.exe" artifacts
          Copy-Item "$bundle/nsis/*-setup.exe.sig" artifacts

      - name: Generate checksums
        shell: bash
        # Per-target file: the matrix jobs upload concurrently with --clobber,
        # so a shared name would race and leave only the last uploader's
        # entries. -type f excludes the .app directory bundles macOS copies in.
        run: |
          cd artifacts
          if command -v sha256sum > /dev/null 2>&1; then
            find * -maxdepth 0 -type f -print0 | xargs -0 -r sha256sum > "SHA256SUMS-${{ matrix.target }}"
          else
            find * -maxdepth 0 -type f -print0 | xargs -0 shasum -a 256 > "SHA256SUMS-${{ matrix.target }}"
          fi

      - name: Upload artifacts to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
        shell: bash
        run: gh release upload "${TAG_NAME}" --clobber artifacts/*

  # The updater endpoint is a static JSON file next to the installers. Each
  # entry points at the platform asset on this release together with the
  # contents of its `.sig` file (the signature itself, not a path). The
  # manifest must upload cleanly before publish runs: an empty signature or a
  # missing asset would hand users an update that cannot be verified.
  manifest:
    name: Build updater manifest
    needs: sandy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          release_url="https://github.com/${GH_REPO}/releases/download/${TAG_NAME}"
          # Values are collected into standalone assignments: inside inline
          # command substitutions bash would swallow their failures even with
          # set -e, and a malformed manifest must abort before it uploads.
          notes="$(gh release view "${TAG_NAME}" --json body --jq .body | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().strip()))')"
          # The URL must name the exact uploaded asset, so take it from the
          # downloaded `.sig` file's real name (the bundle name plus .sig)
          # instead of assuming the bundler's version-in-file-name scheme.
          collect() {
            local pattern="$1"
            local dir signature asset
            dir="$(mktemp -d)"
            gh release download "${TAG_NAME}" --pattern "${pattern}.sig" --dir "$dir"
            signature="$(tr -d '\n' < "$dir"/*.sig)"
            if [ -z "$signature" ]; then
              echo "No signature downloaded for ${pattern}" >&2
              exit 1
            fi
            asset="$(basename "$dir"/*.sig .sig)"
            rm -rf "$dir"
            printf '"%s": { "signature": "%s", "url": "%s/%s" }' "$2" "$signature" "$release_url" "$asset"
          }
          linux="$(collect 'Sandy_*_amd64.AppImage' 'linux-x86_64')"
          darwin="$(collect 'Sandy.app.tar.gz' 'darwin-aarch64')"
          windows="$(collect 'Sandy_*_x64-setup.exe' 'windows-x86_64')"
          {
            printf '{\n  "version": "%s",\n  "notes": %s,\n  "platforms": {\n' "$version" "$notes"
            printf '    %s,\n' "$linux"
            printf '    %s,\n' "$darwin"
            printf '    %s\n' "$windows"
            printf '  }\n}\n'
          } > latest.json
          python3 -m json.tool latest.json >/dev/null
          gh release upload "${TAG_NAME}" --clobber latest.json

  publish:
    name: Publish release
    needs: [sandy, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag }}
        shell: bash
        run: gh release edit "${TAG_NAME}" --draft=false --latest
