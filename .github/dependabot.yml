version: 2

updates:
  # Frontend (npm/pnpm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Match minimumReleaseAge in pnpm-workspace.yaml (1440 minutes)
    cooldown:
      default-days: 1
    groups:
      dependencies:
        applies-to: version-updates
        patterns:
          - "*"

  # Desktop shell (Rust)
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 1
    groups:
      dependencies:
        applies-to: version-updates
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 1
    groups:
      dependencies:
        applies-to: version-updates
        patterns:
          - "*"
